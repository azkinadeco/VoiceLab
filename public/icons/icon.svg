<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>

    <!-- Spectrum Gradients -->
    <linearGradient id="helixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="magentaGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#22d3ee" opacity="0.12" filter="url(#glow)"/>

  <!-- Connecting DNA Rails -->
  <path d="M 110 230 Q 180 140 256 160 T 402 230" fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 110 282 Q 180 372 256 352 T 402 282" fill="none" stroke="url(#magentaGlow)" stroke-width="4" filter="url(#glow)"/>

  <!-- 13 Bio-Helix Frequency Bars -->
  <g fill="url(#helixGrad)">
    <rect x="104" y="225" width="12" height="62" rx="6"/>
    <rect x="128" y="200" width="14" height="112" rx="7"/>
    <rect x="152" y="165" width="16" height="182" rx="8"/>
    <rect x="176" y="128" width="18" height="256" rx="9"/>
    <rect x="200" y="103" width="20" height="306" rx="10"/>
    <rect x="224" y="128" width="18" height="256" rx="9"/>
    <rect x="248" y="170" width="16" height="172" rx="8"/>
    <rect x="272" y="128" width="18" height="256" rx="9"/>
    <rect x="296" y="103" width="20" height="306" rx="10"/>
    <rect x="320" y="128" width="18" height="256" rx="9"/>
    <rect x="344" y="165" width="16" height="182" rx="8"/>
    <rect x="368" y="200" width="14" height="112" rx="7"/>
    <rect x="392" y="225" width="12" height="62" rx="6"/>
  </g>

  <!-- Central Acoustic Diamond Prism Core -->
  <circle cx="256" cy="256" r="38" fill="#0b0d13" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
  <!-- 8-Point Diamond Star -->
  <polygon points="256,234 262,250 278,256 262,262 256,278 250,262 234,256 250,250" fill="#ffffff" filter="url(#glow)"/>
</svg>
